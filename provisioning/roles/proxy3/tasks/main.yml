---
- name: Check apt sources for EOL Debian
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare 3proxy system account and directories
  ansible.builtin.import_tasks: install.yml

- name: Build 3proxy from source
  ansible.builtin.import_tasks: build.yml

- name: Render 3proxy configuration
  ansible.builtin.import_tasks: configure.yml

- name: Open proxy port in the firewall
  ansible.builtin.import_tasks: firewall.yml
  when: proxy3_manage_firewall

- name: Ensure 3proxy service is running
  ansible.builtin.import_tasks: service.yml
