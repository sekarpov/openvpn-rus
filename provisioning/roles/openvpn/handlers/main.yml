---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload netfilter-persistent
  ansible.builtin.service:
    name: netfilter-persistent
    state: restarted

- name: Restart openvpn
  ansible.builtin.service:
    name: "{{ openvpn_service_name }}"
    state: restarted
