---
- name: Validate requested client
  ansible.builtin.import_tasks: validate_client.yml

- name: Ensure client exists and is active
  ansible.builtin.assert:
    that:
      - openvpn_client_index_status.stdout == "V"
    fail_msg: "Client {{ openvpn_client_name }} must exist and be active before revocation."

- name: Revoke client certificate
  ansible.builtin.command: "./easyrsa --batch revoke {{ openvpn_client_name }}"
  args:
    chdir: "{{ openvpn_easy_rsa_dir }}"

- name: Regenerate CRL after revocation
  ansible.builtin.command: ./easyrsa gen-crl
  args:
    chdir: "{{ openvpn_easy_rsa_dir }}"

- name: Deploy updated CRL
  ansible.builtin.copy:
    src: "{{ openvpn_pki_dir }}/crl.pem"
    dest: "{{ openvpn_server_conf_dir }}/{{ openvpn_crl_filename }}"
    owner: root
    group: root
    mode: "{{ openvpn_file_mode_public }}"
    remote_src: true
  notify: Restart openvpn

- name: Flush handlers before local cleanup
  ansible.builtin.meta: flush_handlers

- name: Check local client artifact presence
  ansible.builtin.stat:
    path: "{{ openvpn_local_client_artifact_path }}"
  register: openvpn_local_client_artifact_stat
  delegate_to: localhost
  become: false

- name: Ensure local revoked archive directory exists
  ansible.builtin.file:
    path: "{{ openvpn_local_revoked_dir }}"
    state: directory
    mode: "0700"
  when:
    - openvpn_revoke_archive_local_artifact
    - openvpn_local_client_artifact_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Archive revoked local client artifact
  ansible.builtin.command:
    argv:
      - mv
      - "{{ openvpn_local_client_artifact_path }}"
      - "{{ openvpn_local_revoked_dir }}/{{ openvpn_client_name }}-{{ ansible_date_time.iso8601_basic_short }}.ovpn"
  when:
    - openvpn_revoke_archive_local_artifact
    - openvpn_local_client_artifact_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Remove local client artifact when archive is disabled
  ansible.builtin.file:
    path: "{{ openvpn_local_client_artifact_path }}"
    state: absent
  when:
    - not openvpn_revoke_archive_local_artifact
    - openvpn_local_client_artifact_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Report revocation result
  ansible.builtin.debug:
    msg: "Revoked {{ openvpn_client_name }} and updated CRL"
